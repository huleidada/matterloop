name: publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install the locked development environment
        run: |
          uv lock --check
          uv sync --all-extras --dev --locked
          uv pip check --python .venv/bin/python

      - name: Validate the release contract
        run: uv run python scripts/check_release.py --tag "${GITHUB_REF_NAME}"

      - name: Run quality gates
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run python scripts/check_dependencies.py
          uv run coverage run -m pytest
          uv run coverage report

      - name: Build all distributions from the tag
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-dist
          mkdir release-dist
          packages=(
            matterloop-core
            matterloop-models
            matterloop-runtime
            matterloop-tools
            matterloop-memory
            matterloop-policies
            matterloop-agents
            matterloop-observability
            matterloop-presets
            matterloop-integration-fastapi
            matterloop-integration-celery
            matterloop-integration-redis
          )
          for package in "${packages[@]}"; do
            uv build "${package}" --out-dir release-dist
          done

      - name: Check package metadata and artifact count
        shell: bash
        run: |
          set -euo pipefail
          uv run twine check release-dist/*
          wheel_count="$(find release-dist -maxdepth 1 -type f -name '*.whl' | wc -l | tr -d ' ')"
          sdist_count="$(find release-dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d ' ')"
          test "${wheel_count}" = "12"
          test "${sdist_count}" = "12"

      - name: Verify wheels in a clean environment
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          uv venv .release-wheel-test --python 3.13
          uv pip install \
            --python .release-wheel-test/bin/python \
            --find-links release-dist \
            "matterloop-presets==${version}" \
            "matterloop-integration-fastapi==${version}" \
            "matterloop-integration-celery==${version}" \
            "matterloop-integration-redis==${version}" \
            "matterloop-models[openai]==${version}" \
            "matterloop-observability[otel]==${version}" \
            "matterloop-tools[mcp]==${version}"
          uv pip check --python .release-wheel-test/bin/python
          .release-wheel-test/bin/python -I scripts/verify_imports.py \
            matterloop_core \
            matterloop_models \
            matterloop_runtime \
            matterloop_tools \
            matterloop_memory \
            matterloop_policies \
            matterloop_agents \
            matterloop_observability \
            matterloop_presets \
            matterloop_integration_fastapi \
            matterloop_integration_celery \
            matterloop_integration_redis
          .release-wheel-test/bin/python -c "import mcp.client.session, mcp.types, openai, opentelemetry"

      - name: Verify source distributions in a clean environment
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t sdists < <(find release-dist -maxdepth 1 -type f -name '*.tar.gz' | sort)
          test "${#sdists[@]}" = "12"
          uv venv .release-sdist-test --python 3.13
          uv pip install \
            --python .release-sdist-test/bin/python \
            --find-links release-dist \
            "${sdists[@]}"
          uv pip check --python .release-sdist-test/bin/python
          .release-sdist-test/bin/python -I scripts/verify_imports.py \
            matterloop_core \
            matterloop_models \
            matterloop_runtime \
            matterloop_tools \
            matterloop_memory \
            matterloop_policies \
            matterloop_agents \
            matterloop_observability \
            matterloop_presets \
            matterloop_integration_fastapi \
            matterloop_integration_celery \
            matterloop_integration_redis

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-dist
          sha256sum -- * > SHA256SUMS

      - name: Upload the verified release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions-${{ github.ref_name }}
          path: release-dist/
          if-no-files-found: error
          retention-days: 30

  build_tools:
    name: Build and verify matterloop-tools 0.2.4
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Check out the release source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Resolve and validate the package version
        id: package
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          version="$(
            python -c 'import tomllib; print(tomllib.load(open("matterloop-tools/pyproject.toml", "rb"))["project"]["version"])'
          )"
          test "${version}" = "0.2.4"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install the locked tools development environment
        run: |
          uv sync --package matterloop-tools --extra mcp --extra dev --dev --locked
          uv pip check --python .venv/bin/python

      - name: Run matterloop-tools quality gates
        run: |
          uv run ruff check matterloop-tools
          uv run pytest matterloop-tools/tests

      - name: Build matterloop-tools
        shell: bash
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf release-dist
          mkdir release-dist
          uv build matterloop-tools --out-dir release-dist
          uv run twine check release-dist/*
          test "$(find release-dist -maxdepth 1 -type f -name "matterloop_tools-${VERSION}-*.whl" | wc -l | tr -d ' ')" = "1"
          test "$(find release-dist -maxdepth 1 -type f -name "matterloop_tools-${VERSION}.tar.gz" | wc -l | tr -d ' ')" = "1"

      - name: Verify the wheel in a clean environment
        shell: bash
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          uv venv .release-tools-test --python 3.13
          uv pip install \
            --python .release-tools-test/bin/python \
            --find-links release-dist \
            "matterloop-tools[mcp]==${VERSION}"
          uv pip check --python .release-tools-test/bin/python
          .release-tools-test/bin/python -I -c \
            'import importlib.metadata, matterloop_tools; assert importlib.metadata.version("matterloop-tools") == "0.2.4"'

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-dist
          sha256sum -- * > SHA256SUMS

      - name: Upload the verified tools bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: matterloop-tools-${{ steps.package.outputs.version }}
          path: release-dist/
          if-no-files-found: error
          retention-days: 30

  publish_tools:
    name: Publish matterloop-tools to PyPI
    needs: build_tools
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi-tools
      url: https://pypi.org/project/matterloop-tools/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the verified tools bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: matterloop-tools-${{ needs.build_tools.outputs.version }}
          path: release-dist

      - name: Select the distribution artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir package-dist
          cp release-dist/matterloop_tools-*.whl package-dist/
          cp release-dist/matterloop_tools-*.tar.gz package-dist/
          test "$(find package-dist -maxdepth 1 -type f | wc -l | tr -d ' ')" = "2"

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: package-dist
          attestations: true
          print-hash: true
          skip-existing: true
          verbose: true

  verify_tools:
    name: Verify matterloop-tools from PyPI
    needs:
      - build_tools
      - publish_tools
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
          enable-cache: false

      - name: Install and verify the public package
        shell: bash
        env:
          VERSION: ${{ needs.build_tools.outputs.version }}
        run: |
          set -euo pipefail
          uv venv .pypi-tools-test --python 3.13
          for attempt in {1..12}; do
            if uv pip install \
              --python .pypi-tools-test/bin/python \
              --index-url https://pypi.org/simple \
              --refresh \
              "matterloop-tools[mcp]==${VERSION}"; then
              break
            fi
            if test "${attempt}" = "12"; then
              echo "PyPI 在等待窗口内仍未提供 matterloop-tools==${VERSION}" >&2
              exit 1
            fi
            sleep 10
          done
          uv pip check --python .pypi-tools-test/bin/python
          .pypi-tools-test/bin/python -I -c \
            'import importlib.metadata, matterloop_tools; assert importlib.metadata.version("matterloop-tools") == "0.2.4"'

  release_tools:
    name: Create the matterloop-tools GitHub Release
    needs:
      - build_tools
      - verify_tools
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create the package release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build_tools.outputs.version }}
        run: |
          set -euo pipefail
          tag="matterloop-tools-v${VERSION}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "${tag} 已存在，跳过重复创建。"
            exit 0
          fi
          gh release create "${tag}" \
            --target "${GITHUB_SHA}" \
            --title "matterloop-tools ${VERSION}" \
            --notes "独立发布 matterloop-tools ${VERSION}：增加统一工具能力契约、本地 Tool/MCP 装饰器、MCP 来源标识与结构化完成证据。"

  publish:
    name: Publish ${{ matrix.distribution }} to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: matterloop-core
            artifact_prefix: matterloop_core
            environment: pypi
          - distribution: matterloop-models
            artifact_prefix: matterloop_models
            environment: pypi-models
          - distribution: matterloop-runtime
            artifact_prefix: matterloop_runtime
            environment: pypi-runtime
          - distribution: matterloop-tools
            artifact_prefix: matterloop_tools
            environment: pypi-tools
          - distribution: matterloop-memory
            artifact_prefix: matterloop_memory
            environment: pypi-memory
          - distribution: matterloop-policies
            artifact_prefix: matterloop_policies
            environment: pypi-policies
          - distribution: matterloop-agents
            artifact_prefix: matterloop_agents
            environment: pypi-agents
          - distribution: matterloop-observability
            artifact_prefix: matterloop_observability
            environment: pypi-observability
          - distribution: matterloop-presets
            artifact_prefix: matterloop_presets
            environment: pypi-presets
          - distribution: matterloop-integration-fastapi
            artifact_prefix: matterloop_integration_fastapi
            environment: pypi-integration-fastapi
          - distribution: matterloop-integration-celery
            artifact_prefix: matterloop_integration_celery
            environment: pypi-integration-celery
          - distribution: matterloop-integration-redis
            artifact_prefix: matterloop_integration_redis
            environment: pypi-integration-redis
    environment:
      name: ${{ matrix.environment }}
      url: https://pypi.org/project/${{ matrix.distribution }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the verified release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions-${{ github.ref_name }}
          path: release-dist

      - name: Select this distribution's verified artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir package-dist
          cp release-dist/${{ matrix.artifact_prefix }}-*.whl package-dist/
          cp release-dist/${{ matrix.artifact_prefix }}-*.tar.gz package-dist/
          test "$(find package-dist -maxdepth 1 -type f | wc -l | tr -d ' ')" = "2"

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: package-dist
          attestations: true
          print-hash: true
          skip-existing: true
          verbose: true

  verify:
    name: Verify installation from PyPI
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out import verification script
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
          enable-cache: false

      - name: Install the published packages from PyPI
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          uv venv .pypi-test --python 3.13
          for attempt in {1..12}; do
            if uv pip install \
              --python .pypi-test/bin/python \
              --index-url https://pypi.org/simple \
              --refresh \
              "matterloop-presets==${version}" \
              "matterloop-integration-fastapi==${version}" \
              "matterloop-integration-celery==${version}" \
              "matterloop-integration-redis==${version}" \
              "matterloop-models[openai]==${version}" \
              "matterloop-observability[otel]==${version}" \
              "matterloop-tools[mcp]==${version}"; then
              break
            fi
            if test "${attempt}" = "12"; then
              echo "PyPI 在等待窗口内仍未提供全部发行包" >&2
              exit 1
            fi
            sleep 10
          done
          uv pip check --python .pypi-test/bin/python
          .pypi-test/bin/python -I scripts/verify_imports.py \
            matterloop_core \
            matterloop_models \
            matterloop_runtime \
            matterloop_tools \
            matterloop_memory \
            matterloop_policies \
            matterloop_agents \
            matterloop_observability \
            matterloop_presets \
            matterloop_integration_fastapi \
            matterloop_integration_celery \
            matterloop_integration_redis
          .pypi-test/bin/python -c "import mcp.client.session, mcp.types, openai, opentelemetry"

  release:
    name: Create the GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the released source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Create the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${RELEASE_TAG} 已存在，跳过重复创建。"
            exit 0
          fi
          version="${RELEASE_TAG#v}"
          awk -v header="## [${version}]" '
            index($0, header) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          {
            echo
            echo "## 发布内容"
            echo
            echo "MatterLoop 的 12 个发行包均已通过 PyPI Trusted Publishing 发布为 \`${version}\`，并完成公共 PyPI 安装验证。"
            echo
            echo "完整变更请参阅 [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${RELEASE_TAG}/CHANGELOG.md)。"
          } >> release-notes.md
          gh release create "${RELEASE_TAG}" \
            --verify-tag \
            --latest \
            --title "MatterLoop ${RELEASE_TAG}" \
            --notes-file release-notes.md
